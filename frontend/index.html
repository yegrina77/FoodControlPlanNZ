<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCP Audit 문제집</title>
<style>
  :root {
    --primary: #1e3a5f;
    --accent: #2f9e44;
    --danger: #e03131;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #212529;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    min-height: 100vh;
  }
  h1 { font-size: 1.3rem; color: var(--primary); margin: 8px 0 20px; }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }
  input[type="password"], select {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.5; }
  button.secondary { background: #868e96; margin-top: 8px; }
  .error { color: var(--danger); font-size: 0.9rem; margin-bottom: 8px; }
  .toplinks {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }
  .lang-toggle {
    background: #e9ecef; color: var(--text); border-radius: 20px; padding: 6px 14px;
    font-size: 0.85rem; width: auto; cursor: pointer;
  }
  .progress { font-size: 0.85rem; color: #495057; margin-bottom: 10px; }
  .question-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #f1f3f5;
    color: var(--text);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .option.correct { background: #d3f9d8; border-color: var(--accent); }
  .option.wrong { background: #ffe3e3; border-color: var(--danger); }
  .option[disabled] { cursor: default; }
  .explain-box {
    margin-top: 14px;
    padding: 14px;
    background: #eef4fb;
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .explain-box .ref {
    margin-top: 8px;
    font-size: 0.8rem;
    color: #495057;
    font-style: italic;
  }
  .result-row { display: flex; justify-content: space-between; margin: 4px 0; }
  .cat-badge {
    display: inline-block; background: #dee2e6; border-radius: 12px; padding: 2px 10px;
    font-size: 0.75rem; margin-bottom: 10px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍣 FCP Audit 대비 문제집</h1>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="card">
    <p>매장 보호코드를 입력하세요 / Enter store access code</p>
    <div id="loginError" class="error hidden"></div>
    <input type="password" id="codeInput" placeholder="Access code">
    <button onclick="doLogin()">입장 / Enter</button>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="card hidden">
    <div class="toplinks">
      <span>퀴즈 설정</span>
      <button class="lang-toggle" onclick="toggleLang()" id="langBtn" style="width:auto;">KO / EN</button>
    </div>
    <label>카테고리</label>
    <select id="categorySelect"></select>
    <label>문제 수</label>
    <select id="countSelect">
      <option value="5">5문제</option>
      <option value="10" selected>10문제</option>
      <option value="20">20문제</option>
    </select>
    <button onclick="startQuiz()">시작하기 / Start</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="card hidden">
    <div class="toplinks">
      <div class="progress" id="progressLabel"></div>
      <button class="lang-toggle" onclick="toggleLang()" style="width:auto;">KO / EN</button>
    </div>
    <div class="cat-badge" id="catBadge"></div>
    <div class="question-text" id="questionText"></div>
    <div id="optionsList"></div>
    <div id="explainBox" class="explain-box hidden"></div>
    <button id="nextBtn" class="hidden" onclick="nextQuestion()">다음 / Next</button>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="card hidden">
    <h2>결과 / Result</h2>
    <div class="result-row"><span>정답</span><span id="scoreCorrect"></span></div>
    <div class="result-row"><span>오답</span><span id="scoreWrong"></span></div>
    <button onclick="resetToSetup()">다시 풀기 / Retry</button>
  </div>
</div>

<script>
let lang = 'ko'; // 'ko' or 'en'
let quizQuestions = [];
let currentIndex = 0;
let score = { correct: 0, wrong: 0 };
let answered = false;

const catNames = {
  setting_up: { ko: 'Setting up (매장 설정)', en: 'Setting up' },
  preparing: { ko: 'Preparing (준비)', en: 'Preparing' },
  making_cooking: { ko: 'Making & Cooking (조리)', en: 'Making & Cooking' },
  specialist_sushi: { ko: 'Specialist - 스시', en: 'Specialist - Sushi' },
  all: { ko: '전체 (통합)', en: 'All (mixed)' }
};

function show(id) {
  ['loginScreen','setupScreen','quizScreen','resultScreen'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

async function doLogin() {
  const code = document.getElementById('codeInput').value;
  const errBox = document.getElementById('loginError');
  errBox.classList.add('hidden');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.ok) {
      await loadCategories();
      show('setupScreen');
    } else {
      errBox.textContent = data.error || '코드가 올바르지 않습니다';
      errBox.classList.remove('hidden');
    }
  } catch (e) {
    errBox.textContent = '연결 오류. 다시 시도해주세요.';
    errBox.classList.remove('hidden');
  }
}

async function loadCategories() {
  const res = await fetch('/api/categories');
  const data = await res.json();
  const sel = document.getElementById('categorySelect');
  sel.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = 'all';
  allOpt.textContent = catNames.all.ko;
  sel.appendChild(allOpt);
  (data.categories || []).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = (catNames[c] && catNames[c].ko) || c;
    sel.appendChild(opt);
  });
}

function toggleLang() {
  lang = lang === 'ko' ? 'en' : 'ko';
  renderQuestion();
}

async function startQuiz() {
  const category = document.getElementById('categorySelect').value;
  const count = document.getElementById('countSelect').value;
  const res = await fetch(`/api/quiz?category=${category}&count=${count}`);
  const data = await res.json();
  quizQuestions = data.questions || [];
  currentIndex = 0;
  score = { correct: 0, wrong: 0 };
  if (quizQuestions.length === 0) {
    alert('문제가 없습니다.');
    return;
  }
  show('quizScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = quizQuestions[currentIndex];
  answered = false;
  document.getElementById('progressLabel').textContent =
    `${currentIndex + 1} / ${quizQuestions.length}`;
  document.getElementById('catBadge').textContent =
    (catNames[q.category] && catNames[q.category][lang]) || q.category;
  document.getElementById('questionText').textContent = lang === 'ko' ? q.text_ko : q.text_en;

  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = lang === 'ko' ? opt.text_ko : opt.text_en;
    btn.onclick = () => selectOption(idx);
    list.appendChild(btn);
  });

  document.getElementById('explainBox').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
}

async function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = quizQuestions[currentIndex];
  const opt = q.options[idx];
  const buttons = document.querySelectorAll('#optionsList .option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (q.options[i].correct) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
  });

  const isCorrect = !!opt.correct;
  if (isCorrect) score.correct++; else score.wrong++;

  fetch('/api/report', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ question_id: q.id, correct: isCorrect })
  }).catch(() => {});

  const explainBox = document.getElementById('explainBox');
  const explanation = lang === 'ko' ? q.explanation_ko : q.explanation_en;
  explainBox.innerHTML = `<div>${explanation}</div><div class="ref">📍 ${q.fcp_reference}</div>`;
  explainBox.classList.remove('hidden');

  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('scoreCorrect').textContent = score.correct;
  document.getElementById('scoreWrong').textContent = score.wrong;
  show('resultScreen');
}

function resetToSetup() {
  show('setupScreen');
}

// on load, try setup screen directly if already authed (best-effort)
show('loginScreen');
</script>
</body>
</html>
